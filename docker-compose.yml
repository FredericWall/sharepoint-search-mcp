services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sharepoint_mcp
      POSTGRES_USER: sharepoint_mcp
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharepoint_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
